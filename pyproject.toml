[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]

[project]
name = "hallmark"
dynamic = ["version"]
license = "Apache-2.0"
description = "Reproducibility is the hallmark of the scientific method"
readme = "README.rst"
requires-python = ">=3.9"

dependencies =[
    "click>=8.1",
    "GitPython>=3.1.30",
    "numpy>=1.21",
    "pandas>=1.5",
    "parse>=1.19",
    "pyyaml>=5.4",
    "requests>=2.26",
    "tqdm>=4.60",
]

authors = [
    {name = "Chi-kwan Chan"},
    {name = "Nayera Abdessalam"},
    {name = "Hayden Marchinek"},
    {name = "Rohin Sant"},
    {name = "Ram Adithya"},
    {name = "Hayden Foote"},
    {name = "Samuel Jacobs"},
    {name = "Yaqing Su"},
    {name = "Tianrui (Dennis) Wu"},
    {name = "Arshia Akhtarkavan"}
]

[project.optional-dependencies]
keyring = ["keyring"]
s3 = ["boto3>=1.28"]

[project.scripts]
hallmark = "hallmark.cli:hallmark"
hm = "hallmark.cli:hallmark"

[project.urls]
Homepage = "https://l6a.github.io/hallmark"
Repository = "https://github.com/l6a/hallmark"
Issues = "https://github.com/l6a/hallmark/issues"

[dependency-groups]
s3-test = ["boto3>=1.28", "moto[s3]>=5"]
dev = ["pytest", "pytest-cov", "pytest-timeout"]
doc = ["sphinx"]
lint = ["ruff"]

[tool.setuptools.packages.find]
where = ["mod"]

[tool.ruff]
target-version = "py39"
# Excluded at the top level so the shell cells in demo notebooks are not parsed.
extend-exclude = ["doc", "demo"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--strict-markers"
markers = [
    "ssh_client: exercise the actual local OpenSSH SFTP command parser",
    "ssh_integration: disposable loopback sshd (HALLMARK_RUN_SSH_TESTS=1 required)",
    "chaos: fault injection, crash consistency and seeded random operations",
    "survey: end-to-end survey workflows against loopback HTTP and SSH servers",
    "survey_live: tiny downloads from public archives (HALLMARK_RUN_LIVE_TESTS=1 required)",
]

[tool.coverage.run]
source_pkgs = ["hallmark"]
branch = true
# Store repository-relative paths so data from Linux and macOS jobs combines.
relative_files = true

[tool.coverage.paths]
hallmark = ["mod/hallmark", "*/mod/hallmark", "*/site-packages/hallmark"]

[tool.coverage.report]
show_missing = true
skip_covered = true
