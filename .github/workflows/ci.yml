# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10","3.11","3.12","3.13","3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff pytest
        python -m pip install -e .
    - name: Lint with ruff
      run: |
        ruff check --select E,F --exclude ./demo
    - name: Test with pytest
      run: |
        pytest

  ssh-transport:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    - name: Install Linux SSH server
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y openssh-server
    - name: Install Hallmark and tests
      run: python -m pip install -e . pytest
    - name: Exercise disposable OpenSSH server and client
      env:
        HALLMARK_RUN_SSH_TESTS: "1"
      run: python -m pytest test/test_ssh_integration.py test/test_transport.py -q
