# Lints, tests every supported Python version on Linux and macOS, and checks
# the built distributions and documentation.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main", "dev" ]
  # Pull requests into any branch, including stacked feature branches.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install ruff
      run: python -m pip install ruff
    - name: Lint with ruff
      run: ruff check .

  # Every job runs the whole suite, including the loopback OpenSSH tests, so
  # each Python version and both operating systems exercise every module.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pinned because Python 3.9 builds may not exist for newer images.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
        - os: macos-latest
          python-version: "3.9"
        - os: macos-latest
          python-version: "3.14"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the OpenSSH server
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
    - name: Install Hallmark and test tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . --group dev
    - name: Test with pytest
      env:
        HALLMARK_RUN_SSH_TESTS: "1"
        COVERAGE_FILE: .coverage.${{ runner.os }}-py${{ matrix.python-version }}
      run: python -m pytest --cov --cov-report= --timeout=600 -ra --durations=15
    - name: Upload coverage data
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ runner.os }}-py${{ matrix.python-version }}
        path: .coverage.${{ runner.os }}-py${{ matrix.python-version }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  coverage:
    needs: [test, s3-backend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install coverage
      run: python -m pip install coverage
    - uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        merge-multiple: true
    - name: Combine and report coverage
      run: |
        coverage combine
        coverage report
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        coverage xml
        coverage html
    - name: Upload the combined report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
    - name: Upload coverage to Codecov
      continue-on-error: true
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage.xml
        disable_search: true
        fail_ci_if_error: true
        use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
        use_pypi: true
    - name: Enforce the coverage floor
      run: coverage report --fail-under=89

  distribution-and-docs:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Build and check source and wheel distributions
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check --strict dist/*
    - name: Install the wheel and documentation tools
      run: python -m pip install dist/*.whl sphinx
    - name: Check both installed commands
      run: |
        hm --help
        hallmark --help
      working-directory: ${{ runner.temp }}
    - name: Build documentation with warnings as errors
      run: python -m sphinx -b html -W --keep-going doc "${{ runner.temp }}/hallmark-docs"

  ssh-transport:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    - name: Install Linux SSH server
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y openssh-server
    - name: Install Hallmark and tests
      run: python -m pip install -e . pytest
    - name: Exercise disposable OpenSSH server and client
      env:
        HALLMARK_RUN_SSH_TESTS: "1"
      run: python -m pytest test/test_ssh_integration.py test/test_transport.py -q

  s3-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Hallmark with S3 support and moto
      run: python -m pip install -e ".[s3]" pytest pytest-cov "moto[s3]>=5"
    - name: Test the S3 backend against moto
      env:
        COVERAGE_FILE: .coverage.s3
      run: >-
        python -m pytest -q --cov --cov-report= test/test_s3.py
        test/test_s3_edge_cases.py
        "test/test_demo_notebooks.py::test_demo_notebook_workflow[demo_private_data.ipynb]"
    - name: Upload coverage data
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-s3
        path: .coverage.s3
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  ssh-oldest-openssh:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: rockylinux:8  # OpenSSH 8.0
          packages: python39 python39-pip
        - image: rockylinux:9  # RHEL 9's patched OpenSSH
          packages: python3 python3-pip
    steps:
    - name: Install OpenSSH, Git and Python 3.9
      run: |
        dnf install -y git findutils openssh-server openssh-clients shadow-utils ${{ matrix.packages }}
        # The image locks root, so sshd without PAM refuses even key logins.
        usermod -p '*' root
        ssh -V
    - uses: actions/checkout@v4
    - name: Install Hallmark and tests
      run: |
        python3.9 -m pip install --upgrade pip
        python3.9 -m pip install -e . pytest
    - name: Exercise disposable OpenSSH server and client
      env:
        HALLMARK_RUN_SSH_TESTS: "1"
      run: >-
        python3.9 -m pytest -q test/test_ssh_integration.py
        test/test_transport.py test/test_sftp_metadata.py
