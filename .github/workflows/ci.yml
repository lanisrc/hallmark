# Lints, tests every supported Python version on Linux and macOS, and checks
# the built distributions and documentation.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main", "dev" ]
  # Pull requests into any branch, including stacked feature branches.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install ruff
      run: python -m pip install ruff
    - name: Lint with ruff
      run: ruff check .

  # Every job runs the whole suite, including the loopback OpenSSH tests, so
  # each Python version and both operating systems exercise every module.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pinned because Python 3.9 builds may not exist for newer images.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
        - os: macos-latest
          python-version: "3.9"
        - os: macos-latest
          python-version: "3.14"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the OpenSSH server
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
    - name: Install Hallmark and test tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . --group dev
    - name: Test with pytest
      env:
        HALLMARK_RUN_SSH_TESTS: "1"
        COVERAGE_FILE: .coverage.${{ runner.os }}-py${{ matrix.python-version }}
      run: python -m pytest --cov --cov-report= --timeout=600 -ra --durations=15
    - name: Upload coverage data
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ runner.os }}-py${{ matrix.python-version }}
        path: .coverage.${{ runner.os }}-py${{ matrix.python-version }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  # Combines coverage from every test job. Some branches only run on one
  # Python version or operating system, so no single job sees the total.
  coverage:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lets Codecov verify uploads with OIDC instead of a stored token.
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install coverage
      run: python -m pip install coverage
    - uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        merge-multiple: true
    - name: Combine and report coverage
      run: |
        coverage combine
        coverage report
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        coverage xml
        coverage html
    - name: Upload the combined report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
    # Codecov needs its GitHub App installed on the organization. Until then
    # the upload fails without failing CI; the floor below is the gate.
    # Pull requests from forks cannot request OIDC tokens and upload tokenless.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage.xml
        disable_search: true
        fail_ci_if_error: false
        use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
    # The floor lives here rather than in pyproject.toml because pytest-cov
    # would apply it to each partial run.
    - name: Enforce the coverage floor
      run: coverage report --fail-under=90

  distribution-and-docs:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Build and check source and wheel distributions
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check --strict dist/*
    - name: Install the wheel and documentation tools
      run: python -m pip install dist/*.whl sphinx
    - name: Check both installed commands
      run: |
        hm --help
        hallmark --help
      working-directory: ${{ runner.temp }}
    - name: Build documentation with warnings as errors
      run: python -m sphinx -b html -W --keep-going doc "${{ runner.temp }}/hallmark-docs"
