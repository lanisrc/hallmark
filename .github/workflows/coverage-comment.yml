# Posts the coverage comment for pull requests from forks, whose CI runs only
# get a read-only token. The CI workflow saves the comment as an artifact.

name: Post coverage comment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
    - uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
        COMMENT_ARTIFACT_NAME: python-coverage-comment-action
        COMMENT_FILENAME: python-coverage-comment-action.txt
