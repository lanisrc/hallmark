# Runs the chaos tests with many more random operations and fresh seeds.

name: Nightly

on:
  schedule:
  - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: Random operations per seed
        default: "1000"
      seeds:
        description: Comma-separated seeds (blank derives them from the run)
        default: ""
  # Scheduled and manual runs start only from the default branch.
  pull_request:
    paths:
    - .github/workflows/nightly.yml
    - test/chaos.py
    - test/chaos_child.py
    - test/http_server.py
    - test/survey.py
    - test/test_chaos_*.py

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          python-version: "3.9"
          lane: 1
        - os: ubuntu-24.04
          python-version: "3.14"
          lane: 2
        - os: macos-latest
          python-version: "3.14"
          lane: 3
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Hallmark and test tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . --group dev
    - name: Choose seeds and steps
      env:
        INPUT_SEEDS: ${{ inputs.seeds }}
        INPUT_STEPS: ${{ inputs.steps }}
        RUN_ID: ${{ github.run_id }}
        LANE: ${{ matrix.lane }}
        EVENT: ${{ github.event_name }}
      run: |
        seeds="${INPUT_SEEDS:-${RUN_ID}${LANE}1,${RUN_ID}${LANE}2,${RUN_ID}${LANE}3}"
        if [ "$EVENT" = pull_request ]; then default_steps=300; else default_steps=1000; fi
        steps="${INPUT_STEPS:-$default_steps}"
        [[ "$seeds" =~ ^[0-9,]+$ && "$steps" =~ ^[0-9]+$ ]] || { echo "Invalid seeds or steps"; exit 1; }
        echo "HALLMARK_CHAOS_SEED=$seeds" >> "$GITHUB_ENV"
        echo "HALLMARK_CHAOS_STEPS=$steps" >> "$GITHUB_ENV"
        echo "Chaos seeds: \`$seeds\`, steps per seed: $steps" >> "$GITHUB_STEP_SUMMARY"
    - name: Run the chaos tests
      run: python -m pytest -m chaos -ra --timeout=1800 --basetemp="$RUNNER_TEMP/pytest"
    - name: Keep failed repositories for inspection
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: chaos-${{ runner.os }}-py${{ matrix.python-version }}
        path: ${{ runner.temp }}/pytest
        include-hidden-files: true
        retention-days: 14
